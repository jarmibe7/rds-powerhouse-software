
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =     
   https://github.com/tonton81/FlexCAN_T4.git
   https://github.com/bsobeloffgittes/ODriveArduino.git
   https://github.com/bolderflight/eigen.git

; Build fingerlib with platformio
lib_extra_dirs = 
   ../../fingerlib

; build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17  ; Remove existing standards

build_flags =
  -I../../fingerlib/include
  -I/usr/include/eigen3
  -I include
  ; -std=gnu++23

build_src_filter =
  +<*>
  +<../../../fingerlib/src/kinematics.cpp>

; New stuff from here on
;board_build.f_cpu = 600000000L
;build_flags =
;    -D USB_SERIAL
;    -fno-lto
;build_unflags = -flto



    
